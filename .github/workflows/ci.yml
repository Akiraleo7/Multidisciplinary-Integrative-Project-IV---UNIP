name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__SqlServer: "Server=localhost;Database=HEJCareSuite;Integrated Security=True;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HEJCareSuite.sln

      - name: Build
        run: dotnet build HEJCareSuite.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HEJCareSuite.sln --configuration Release --no-build --verbosity normal

      - name: Validate frontend syntax
        run: |
          node --check src/HEJCareSuite.Api/wwwroot/app.js
          node --check src/HEJCareSuite.Api/wwwroot/sw.js
          node -e "JSON.parse(require('fs').readFileSync('src/HEJCareSuite.Api/wwwroot/manifest.webmanifest', 'utf8'))"

      - name: Build deployment container
        run: docker build --tag hejcare-suite:ci .

      - name: Smoke test deployment container
        run: |
          docker run --detach --name hejcare-suite-ci --publish 18080:8080 \
            --env "ConnectionStrings__SqlServer=Server=localhost;Database=HEJCareSuite;Integrated Security=True;TrustServerCertificate=True" \
            hejcare-suite:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:18080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs hejcare-suite-ci
          exit 1

      - name: Remove deployment container
        if: always()
        run: docker rm --force hejcare-suite-ci || true
