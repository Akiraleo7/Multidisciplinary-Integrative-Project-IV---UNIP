name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__SqlServer: "Server=localhost;Database=HEJCareSuite;Integrated Security=True;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HEJCareSuite.sln

      - name: Build
        run: dotnet build HEJCareSuite.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HEJCareSuite.sln --configuration Release --no-build --verbosity normal

      - name: Validate frontend syntax
        run: node --check src/HEJCareSuite.Api/wwwroot/app.js
