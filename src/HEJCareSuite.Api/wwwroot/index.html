<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEJ Care Suite</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">HEJ Care Suite</p>
      <h1>Patient intake</h1>
      <p class="subtitle">Register and review patients through the hospital API.</p>
    </header>

    <form id="login-form" class="card login-card">
      <h2>Staff login</h2>
      <div class="login-fields">
        <input name="email" type="email" placeholder="Email" required autocomplete="username">
        <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Sign in</button>
        <button id="logout-button" class="secondary" type="button">Sign out</button>
      </div>
      <p id="login-status" class="status" role="status"></p>
    </form>

    <section class="grid" aria-label="Patient management">
      <form id="patient-form" class="card">
        <h2 id="form-title">Register patient</h2>
        <label>
          Full name
          <input name="fullName" required maxlength="200" autocomplete="name">
        </label>
        <label>
          Birth date
          <input name="birthDate" type="date" required>
        </label>
        <label>
          Document number
          <input name="documentNumber" required maxlength="40">
        </label>
        <button id="submit-button" type="submit">Save patient</button>
        <button id="cancel-button" class="secondary hidden" type="button">Cancel edit</button>
        <p id="form-status" class="status" role="status"></p>
      </form>

      <section class="card">
        <div class="section-heading">
          <h2>Patients</h2>
          <button id="refresh-button" class="secondary" type="button">Refresh</button>
        </div>
        <p id="list-status" class="status" role="status">Loading patients...</p>
        <ul id="patient-list" class="patient-list"></ul>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
